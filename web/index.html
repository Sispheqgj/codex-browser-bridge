<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8fc" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Codex 远控</title>
    <link rel="stylesheet" href="./assets/app.bundle.css?v=source" />
  </head>
  <body>
    <section class="login" id="login">
      <div class="logo">↔</div>
      <h1>Codex 远控</h1>
      <p>首次输入配对密钥即可连接，之后会记住这台浏览器。</p>
      <p id="autoConnecting">正在自动连接这台设备…</p>
      <button id="retryConnection" class="hidden">重试连接</button>
      <div id="pairForm" class="hidden">
        <input
          type="password"
          id="token"
          placeholder="配对密钥"
          autocomplete="current-password"
        /><button class="primary" id="loginButton">连接服务器</button>
        <p class="muted">首次配对后记住此 Safari，之后自动连接，有效期 180 天。</p>
      </div>
      <p id="loginError" role="status"></p>
    </section>
    <div id="app" class="hidden">
      <header>
        <div class="logo">↔</div>
        <div class="grow">
          <h1>Codex 远控</h1>
          <small id="connection">正在连接…</small>
        </div>
        <button id="deviceAccess" aria-label="设备登录设置">已配对</button
        ><button id="refresh" aria-label="刷新会话">刷新</button>
      </header>
      <div class="layout">
        <aside>
          <div class="filters">
            <div class="filter-row">
              <select id="hostFilter" aria-label="筛选设备">
                <option value="all">全部设备</option>
                <option value="mac">这台 Mac</option></select
              ><label class="muted"><input id="archived" type="checkbox" /> 已归档</label>
            </div>
            <input id="search" placeholder="搜索项目、会话或路径" aria-label="搜索会话" />
          </div>
          <div class="view-switch">
            <button id="recentView">最近</button><button id="projectView">项目</button>
          </div>
          <div id="hostStatus" class="hostline"></div>
          <div id="threadList"></div>
        </aside>
        <main>
          <div id="blank" class="empty">
            <strong>选择一个原会话</strong><span>本机与服务器，继续同一个原会话。</span>
          </div>
          <div id="chat" class="hidden" style="display: contents">
            <div class="conversation-head">
              <button id="back" class="back" aria-label="返回会话列表">‹</button>
              <div class="grow">
                <h2 id="chatTitle"></h2>
                <div class="muted" id="chatMeta"></div>
                <details>
                  <summary class="muted">会话信息</summary>
                  <div class="info" id="chatInfo"></div>
                </details>
              </div>
            </div>
            <div id="messages" class="messages"></div>
            <div id="queued" class="requests"></div>
            <div id="requests" class="requests"></div>
            <div class="composer">
              <div class="model-row">
                <label class="model-field"
                  >模型<select id="modelSelect" aria-label="选择模型" disabled>
                    <option>沿用原会话</option>
                  </select></label
                ><label class="model-field"
                  >思考强度<select id="reasoningSelect" aria-label="选择思考强度" disabled>
                    <option>默认</option>
                  </select></label
                >
              </div>
              <div class="model-status-row">
                <span id="modelStatus" role="status"></span
                ><button id="modelApply" class="hidden" aria-label="应用模型设置">应用</button>
              </div>
              <textarea
                id="message"
                placeholder="输入给原会话的新指令"
                aria-label="发送给原会话的消息"
              ></textarea>
              <div class="composer-actions">
                <span class="composer-status" id="chatStatus"></span
                ><button id="stop" class="danger hidden">停止任务</button
                ><button id="queue" class="hidden">排队</button
                ><button id="send" class="primary">发送</button>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
    <div id="notice" class="notice hidden"></div>
    <dialog id="accessPanel">
      <h2>已记住这台设备</h2>
      <p>同一 Safari 普通标签页中，下次打开会自动连接，登录有效期 180 天。</p>
      <p>
        可以收藏当前页面。添加到主屏幕后，系统有时使用独立存储；首次打开若需配对，扫码一次即可。
      </p>
      <p>更换浏览器、清除网站数据或使用无痕模式后，需要重新配对。</p>
      <div class="access-actions">
        <button id="forgetDevice">取消记住本设备</button
        ><button id="closeAccess" class="primary">知道了</button>
      </div>
    </dialog>
    <script src="./assets/app.bundle.js?v=source"></script>
  </body>
</html>
